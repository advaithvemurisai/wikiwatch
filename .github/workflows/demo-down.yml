# End a session: destroy infra/compute and clear the soak flag. The lake (foundation
# stack) is untouched, so the dashboard keeps serving the last snapshots.
name: demo-down

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compute-stack
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"

jobs:
  down:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - uses: ./.github/actions/compute-destroy
        with:
          state-bucket: ${{ secrets.TF_STATE_BUCKET }}
      - name: Clear the soak flag
        run: aws ssm delete-parameter --name /wikiwatch/soak_until > /dev/null 2>&1 || true
