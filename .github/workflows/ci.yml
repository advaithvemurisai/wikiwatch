# CI for every pull request and every push to main. Third-party actions are pinned to
# full commit SHAs (tag in the comment); the workflow token can only read the repo.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: sqlfluff lint dbt

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Spark's Ivy packages (Iceberg runtime for local Spark tests)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ivy2
          key: ivy-${{ hashFiles('streaming/tests/conftest.py') }}
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e producer
      - run: python -m pytest

  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needs main's version of the schema
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e producer
      - name: Start a Schema Registry (Redpanda)
        run: |
          docker run -d --name redpanda -p 18081:18081 redpandadata/redpanda:v26.2.3 \
            redpanda start --mode=dev-container --smp=1 --memory=512M --overprovisioned \
            --schema-registry-addr=0.0.0.0:18081
          for i in $(seq 1 30); do curl -fs http://localhost:18081/subjects && break; sleep 2; done
      - name: Event schema is backward compatible with main
        run: python scripts/check_schema_compat.py --base-ref origin/main
      - name: Fixture events match the schema
        run: python -m pytest tests/test_contract.py

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e producer
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the Spark image (layer cache in GitHub Actions)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/spark
          tags: wikiwatch/spark:4.1.3-iceberg1.12.0
          load: true
          cache-from: type=gha,scope=spark
          cache-to: type=gha,mode=max,scope=spark
      - name: Build the Iceberg REST catalog image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/iceberg-rest
          tags: wikiwatch/iceberg-rest:1.10.1-pg42.7.13
          load: true
          cache-from: type=gha,scope=iceberg-rest
          cache-to: type=gha,mode=max,scope=iceberg-rest
      - name: End-to-end replay (Redpanda, SeaweedFS, REST catalog, Spark, Trino, dbt)
        run: python tests/e2e/run_e2e.py --no-build --keep
      - name: Container logs on failure
        if: failure()
        run: |
          mkdir -p e2e-logs
          for s in $(docker compose -p wikiwatch-e2e --env-file tmp/.env.e2e --profile core --profile dbt ps -a --services); do
            docker compose -p wikiwatch-e2e --env-file tmp/.env.e2e --profile core --profile dbt logs --no-color "$s" > "e2e-logs/$s.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-logs
          path: e2e-logs/
          retention-days: 7
      - name: Tear down
        if: always()
        run: |
          docker compose -p wikiwatch-e2e --env-file tmp/.env.e2e --profile core --profile dbt down -v || true
          rm -f tmp/.env.e2e

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history
      - name: gitleaks (history and working tree)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner .
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 dir --redact --no-banner .

  web:
    # Activates by itself once web/ exists (Task 8): type check, ESLint, next build and
    # snapshot validation against schemas/dashboard/.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skip until the web app exists
        if: hashFiles('web/package.json') == ''
        run: echo "web/ has no package.json yet (Task 8); nothing to check."
