# Start a session: apply infra/compute from main with the deploy role (GitHub OIDC).
# The instance checks out the given release tag, reads its secrets from SSM and starts the
# core services. It terminates itself after 4 hours (48 for a soak test), and
# nightly-destroy removes whatever is left.
name: demo-up

on:
  workflow_dispatch:
    inputs:
      repo_tag:
        description: Release tag to deploy (for example v0.7.0)
        required: true
        type: string
      market:
        description: spot for integration sessions, on-demand when interruptions would hurt
        type: choice
        options: [spot, on-demand]
        default: spot
      soak:
        description: Soak test (on-demand, 48-hour limit, nightly-destroy skips it)
        type: boolean
        default: false
      availability_zone:
        description: Zone to use, for example us-east-1b (empty = the default zone; set one to retry after a capacity shortage)
        type: string
        default: ""

permissions:
  contents: read

# One compute operation at a time, across demo-up, demo-down and nightly-destroy.
concurrency:
  group: compute-stack
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"

jobs:
  up:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the inputs
        env:
          REPO_TAG: ${{ inputs.repo_tag }}
          MARKET: ${{ inputs.market }}
          SOAK: ${{ inputs.soak }}
          AZ: ${{ inputs.availability_zone }}
        run: |
          # Strip stray spaces from the form fields (an easy copy-paste slip).
          REPO_TAG="${REPO_TAG//[[:space:]]/}"; AZ="${AZ//[[:space:]]/}"
          [[ "$REPO_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*$ ]] \
            || { echo "repo_tag must look like v0.7.0"; exit 1; }
          [[ -z "$AZ" || "$AZ" =~ ^us-east-1[a-f]$ ]] \
            || { echo "availability_zone must be empty or like us-east-1b"; exit 1; }
          git ls-remote --exit-code --tags origin "refs/tags/$REPO_TAG" > /dev/null \
            || { echo "tag $REPO_TAG does not exist"; exit 1; }
          if [[ "$SOAK" == "true" ]]; then MARKET=on-demand; fi
          {
            echo "TF_VAR_repo_tag=$REPO_TAG"
            echo "TF_VAR_market=$MARKET"
            echo "TF_VAR_soak_mode=$SOAK"
            echo "TF_VAR_availability_zone=$AZ"
          } >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Plan (summary only)
        working-directory: infra/compute
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_VAR_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" > /dev/null
          terraform plan -input=false -no-color -out=tfplan > /dev/null
          terraform show -json tfplan > "$RUNNER_TEMP/plan.json"
          python3 "$GITHUB_WORKSPACE/scripts/tf_plan_summary.py" "$RUNNER_TEMP/plan.json"
          rm -f "$RUNNER_TEMP/plan.json"
      - name: Apply
        working-directory: infra/compute
        run: |
          # Terraform's output stays out of the log (ARNs); on failure only the masked
          # Error: lines are printed. The INT timeout lets Terraform stop cleanly, save
          # its state and release the lock before the job's own time limit.
          if ! timeout --signal=INT --kill-after=3m 15m \
              terraform apply -input=false -no-color tfplan > "$RUNNER_TEMP/apply.log" 2>&1; then
            python3 "$GITHUB_WORKSPACE/scripts/tf_errors.py" "$RUNNER_TEMP/apply.log"
            rm -f "$RUNNER_TEMP/apply.log" tfplan
            echo "Apply failed. Anything already created is in the state: run demo-down to remove it."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/apply.log" tfplan
          echo "Session instance: $(terraform output -raw instance_id)"
          echo "Boot takes about 10 minutes. Connect with SSM Session Manager (no SSH)."
      # Set only after a successful apply, so a failed apply never shields leftovers.
      - name: Set the soak flag (48 hours)
        if: inputs.soak
        run: |
          aws ssm put-parameter --name /wikiwatch/soak_until --type String --overwrite \
            --value "$(date -u -d '+48 hours' +%Y-%m-%dT%H:%M:%SZ)" > /dev/null
          echo "Soak flag set: nightly-destroy will skip for 48 hours."
