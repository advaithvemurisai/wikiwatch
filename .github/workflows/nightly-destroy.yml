# Safety net: every night, destroy the compute stack if anything is left in it, unless a
# soak test is running (an SSM flag that expires after 48 hours). The instance already
# terminates itself after 4 hours; this also removes the VPC and anything a failed run
# left behind.
name: nightly-destroy

on:
  schedule:
    # 06:00 UTC = 1 a.m. Central Daylight Time (midnight Central Standard Time).
    - cron: "0 6 * * *"
  workflow_dispatch: # to verify the safety net once by hand

permissions:
  contents: read

concurrency:
  group: compute-stack
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"

jobs:
  destroy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Is a soak test running?
        id: soak
        run: |
          # A missing or unreadable flag counts as "no soak": the safe default is to destroy.
          value=$(aws ssm get-parameter --name /wikiwatch/soak_until \
            --query Parameter.Value --output text 2>/dev/null || true)
          echo "active=$(python3 scripts/soak_active.py "$value")" >> "$GITHUB_OUTPUT"
      - name: Is anything deployed?
        id: state
        if: steps.soak.outputs.active != 'true'
        working-directory: infra/compute
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" > /dev/null
          count=$(terraform state list | wc -l)
          echo "Resources in the compute stack: $count"
          echo "exists=$([[ $count -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.state.outputs.exists == 'true'
        uses: ./.github/actions/compute-destroy
        with:
          state-bucket: ${{ secrets.TF_STATE_BUCKET }}
