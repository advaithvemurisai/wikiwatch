# Cloud overlay for EC2, used with docker-compose.yml when ENV_FILE=.env.aws (the Makefile
# adds it automatically). On AWS the lake is S3 and the catalog is Glue, so the local
# stand-ins (SeaweedFS, the Iceberg REST catalog and Trino) move to a `local` profile that
# is never started there, and nothing depends on them.
#
# Spark and the producer also lose the static S3 key variables: on EC2 the instance role
# provides credentials, and an empty key variable can shadow it in some AWS SDKs.

services:
  seaweedfs:
    profiles: !override [local]

  seaweedfs-init:
    profiles: !override [local]

  iceberg-rest:
    profiles: !override [local]

  trino:
    profiles: !override [local]

  spark:
    depends_on: !override
      redpanda:
        condition: service_healthy
    environment: !override
      AWS_REGION: ${AWS_REGION:-us-east-1}
      CATALOG_TYPE: ${CATALOG_TYPE:-glue}
      WAREHOUSE: s3://${WAREHOUSE_BUCKET:?set WAREHOUSE_BUCKET in the env file}/
      KAFKA_BOOTSTRAP: redpanda:9092
      STREAM_TRIGGER: ${STREAM_TRIGGER:-1 minute}
      PYTHONPATH: /opt/wikiwatch

  producer:
    depends_on: !override
      redpanda:
        condition: service_healthy
    environment: !override
      AWS_REGION: ${AWS_REGION:-us-east-1}
      KAFKA_BOOTSTRAP: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      WIKIWATCH_USER_AGENT: ${WIKIWATCH_USER_AGENT:-}
      STATE_BUCKET: ${WAREHOUSE_BUCKET:?set WAREHOUSE_BUCKET in the env file}

  # Airflow on EC2: queries go to Athena, dbt targets Athena, the lake is S3 through the
  # instance role, Airflow connections and variables come from SSM Parameter Store, and
  # the UI requires a login (reached only through SSM port forwarding; no inbound ports).
  airflow:
    depends_on: !override
      postgres:
        condition: service_healthy
    entrypoint: !override ["/bin/bash", "-c"]
    # The admin password comes from SSM through .env.aws; it is written to a root-only
    # file inside the container and never echoed.
    command: !override
      - >-
        umask 077 &&
        printf '{"admin": "%s"}' "$$AIRFLOW_ADMIN_PASSWORD" > /tmp/airflow-passwords.json &&
        exec /entrypoint airflow standalone
    environment: !override
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # The DAGs run on their schedules from the first boot; Airflow pauses new DAGs by default.
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /tmp/airflow-passwords.json
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD (SSM /wikiwatch/env/)}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in the env file}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in the env file}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?set AIRFLOW_API_SECRET_KEY in the env file}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
      AIRFLOW__SECRETS__BACKEND: airflow.providers.amazon.aws.secrets.systems_manager.SystemsManagerParameterStoreBackend
      AIRFLOW__SECRETS__BACKEND_KWARGS: '{"connections_prefix": "/wikiwatch/airflow/connections", "variables_prefix": "/wikiwatch/airflow/variables", "region_name": "${AWS_REGION:-us-east-1}"}'
      AWS_REGION: ${AWS_REGION:-us-east-1}
      QUERY_ENGINE: athena
      ATHENA_WORKGROUP: ${ATHENA_WORKGROUP:?set ATHENA_WORKGROUP in the env file}
      ATHENA_S3_STAGING_DIR: ${ATHENA_S3_STAGING_DIR:?set ATHENA_S3_STAGING_DIR in the env file}
      DBT_TARGET: aws
      KAFKA_BOOTSTRAP: redpanda:9092
      WAREHOUSE_BUCKET: ${WAREHOUSE_BUCKET:?set WAREHOUSE_BUCKET in the env file}
