# Local Trino stands in for Athena (engine v3 is Trino-based). Values are read from the
# container environment at startup, so no credentials or endpoints live in this file.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:CATALOG_URI}
iceberg.rest-catalog.warehouse=${ENV:WAREHOUSE}
fs.native-s3.enabled=true
s3.endpoint=${ENV:S3_ENDPOINT}
s3.region=${ENV:AWS_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
