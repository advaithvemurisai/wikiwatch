# Committed on purpose: every value comes from env_var(), and credentials come from the
# environment (local Trino needs none; Athena uses the AWS default credential chain).
wikiwatch:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    local:
      type: trino
      method: none
      user: "{{ env_var('TRINO_USER', 'dbt') }}"
      host: "{{ env_var('TRINO_HOST', 'localhost') }}"
      port: "{{ env_var('TRINO_PORT', '8085') | int }}"
      http_scheme: http
      database: iceberg
      schema: gold
      threads: 2
    aws:
      type: athena
      s3_staging_dir: "{{ env_var('ATHENA_S3_STAGING_DIR') }}"
      # Table data, kept apart from the staging dir: its query results expire after 7
      # days, and without this dbt-athena puts the tables' data files there too.
      s3_data_dir: "s3://{{ env_var('WAREHOUSE_BUCKET') }}/dbt/"
      region_name: "{{ env_var('AWS_REGION', 'us-east-1') }}"
      database: awsdatacatalog
      schema: gold
      work_group: "{{ env_var('ATHENA_WORKGROUP') }}"
      threads: 2
